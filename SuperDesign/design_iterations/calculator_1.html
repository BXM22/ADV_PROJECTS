<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: oklch(0.15 0.02 250);
            --foreground: oklch(0.98 0 0);
            --card: oklch(0.22 0.03 260);
            --card-foreground: oklch(0.98 0 0);
            --primary: oklch(0.65 0.20 280);
            --primary-foreground: oklch(0.98 0 0);
            --secondary: oklch(0.35 0.05 270);
            --secondary-foreground: oklch(0.98 0 0);
            --muted: oklch(0.25 0.02 260);
            --muted-foreground: oklch(0.70 0 0);
            --accent: oklch(0.55 0.18 320);
            --accent-foreground: oklch(0.98 0 0);
            --destructive: oklch(0.60 0.22 25);
            --destructive-foreground: oklch(0.98 0 0);
            --border: oklch(0.30 0.03 260);
            --input: oklch(0.30 0.03 260);
            --ring: oklch(0.65 0.20 280);
            --font-sans: 'Space Grotesk', 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --radius: 1.25rem;
            --shadow-sm: 0 2px 4px 0px hsl(0 0% 0% / 0.15);
            --shadow: 0 4px 6px -1px hsl(0 0% 0% / 0.20), 0 2px 4px -1px hsl(0 0% 0% / 0.15);
            --shadow-md: 0 10px 15px -3px hsl(0 0% 0% / 0.25), 0 4px 6px -2px hsl(0 0% 0% / 0.15);
            --shadow-lg: 0 20px 25px -5px hsl(0 0% 0% / 0.30), 0 10px 10px -5px hsl(0 0% 0% / 0.15);
            --shadow-xl: 0 25px 50px -12px hsl(0 0% 0% / 0.40);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans) !important;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%) !important;
            background: linear-gradient(135deg, var(--background) 0%, oklch(0.12 0.02 240) 100%) !important;
            color: #ffffff !important;
            color: var(--foreground) !important;
            min-height: 100vh !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 1rem !important;
            overflow: hidden !important;
        }

        .calculator-container {
            background: #2a2a3a !important;
            background: var(--card) !important;
            border-radius: var(--radius) !important;
            padding: 2rem !important;
            box-shadow: var(--shadow-xl) !important;
            border: 1px solid #3a3a4a !important;
            border: 1px solid var(--border) !important;
            max-width: 400px !important;
            width: 100% !important;
            animation: slideUp 600ms ease-out !important;
            backdrop-filter: blur(10px) !important;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .display-container {
            background: #1a1a2a !important;
            background: oklch(0.10 0.02 250) !important;
            border-radius: calc(var(--radius) - 0.5rem) !important;
            padding: 1.5rem !important;
            margin-bottom: 1.5rem !important;
            border: 1px solid #3a3a4a !important;
            border: 1px solid var(--border) !important;
            min-height: 120px !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-end !important;
            position: relative !important;
            overflow: hidden !important;
        }

        .display {
            font-family: var(--font-mono) !important;
            font-size: 2.5rem !important;
            font-weight: 600 !important;
            color: #ffffff !important;
            color: var(--foreground) !important;
            text-align: right !important;
            word-break: break-all !important;
            transition: opacity 200ms, transform 200ms !important;
            line-height: 1.2 !important;
        }

        .display.update {
            animation: numberUpdate 200ms ease-out !important;
        }

        @keyframes numberUpdate {
            0% {
                opacity: 0.7;
                transform: scale(0.98);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .display.error {
            animation: shake 400ms ease-in-out !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .button-grid {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 0.75rem !important;
        }

        .button-row {
            display: contents !important;
        }


        .btn {
            background: #3a3a4a !important;
            background: var(--muted) !important;
            color: #ffffff !important;
            color: var(--foreground) !important;
            border: 1px solid #4a4a5a !important;
            border: 1px solid var(--border) !important;
            border-radius: calc(var(--radius) - 0.5rem) !important;
            font-size: 1.25rem !important;
            font-weight: 500 !important;
            font-family: var(--font-sans) !important;
            padding: 1.25rem !important;
            cursor: pointer !important;
            transition: all 200ms ease !important;
            position: relative !important;
            overflow: hidden !important;
            opacity: 1 !important;
            transform: translateY(0) !important;
            user-select: none !important;
        }

        @keyframes buttonEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.05) !important;
            box-shadow: var(--shadow-md) !important;
        }

        .btn:active {
            transform: translateY(0) scale(0.95) rotate(2deg) !important;
            transition: all 150ms ease !important;
        }

        .btn.number {
            background: #4a4a6a !important;
            background: var(--secondary) !important;
        }

        .btn.operator {
            background: #8b5cf6 !important;
            background: var(--primary) !important;
            color: #ffffff !important;
            color: var(--primary-foreground) !important;
        }

        .btn.operator:hover {
            background: oklch(0.70 0.22 280) !important;
        }

        .btn.equals {
            background: #a855f7 !important;
            background: var(--accent) !important;
            color: #ffffff !important;
            color: var(--accent-foreground) !important;
            grid-column: span 1 !important;
        }

        .btn.equals:hover {
            background: oklch(0.60 0.20 320) !important;
            box-shadow: 0 0 20px oklch(0.55 0.18 320 / 0.5) !important;
        }

        .btn.clear {
            background: #ef4444 !important;
            background: var(--destructive) !important;
            color: #ffffff !important;
            color: var(--destructive-foreground) !important;
        }

        .btn.clear:hover {
            background: oklch(0.65 0.24 25) !important;
        }

        .btn.zero {
            grid-column: span 2 !important;
        }

        .ripple {
            position: absolute !important;
            border-radius: 50% !important;
            background: rgba(255, 255, 255, 0.3) !important;
            transform: scale(0) !important;
            animation: rippleEffect 400ms ease-out !important;
            pointer-events: none !important;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(2);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .calculator-container {
                padding: 1.5rem !important;
            }
            
            .display {
                font-size: 2rem !important;
            }
            
            .btn {
                padding: 1rem !important;
                font-size: 1.1rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="display-container">
            <div class="display" id="display">0</div>
        </div>
        
        <div class="button-grid">
            <div class="button-row">
                <button class="btn clear" onclick="clearAll()">AC</button>
                <button class="btn clear" onclick="backspace()">⌫</button>
                <button class="btn operator" onclick="appendOperator('%')">%</button>
                <button class="btn operator" onclick="appendOperator('÷')">÷</button>
            </div>
            
            <div class="button-row">
                <button class="btn number" onclick="appendNumber('7')">7</button>
                <button class="btn number" onclick="appendNumber('8')">8</button>
                <button class="btn number" onclick="appendNumber('9')">9</button>
                <button class="btn operator" onclick="appendOperator('×')">×</button>
            </div>
            
            <div class="button-row">
                <button class="btn number" onclick="appendNumber('4')">4</button>
                <button class="btn number" onclick="appendNumber('5')">5</button>
                <button class="btn number" onclick="appendNumber('6')">6</button>
                <button class="btn operator" onclick="appendOperator('-')">−</button>
            </div>
            
            <div class="button-row">
                <button class="btn number" onclick="appendNumber('1')">1</button>
                <button class="btn number" onclick="appendNumber('2')">2</button>
                <button class="btn number" onclick="appendNumber('3')">3</button>
                <button class="btn operator" onclick="appendOperator('+')">+</button>
            </div>
            
            <div class="button-row">
                <button class="btn operator" onclick="toggleSign()">±</button>
                <button class="btn number zero" onclick="appendNumber('0')">0</button>
                <button class="btn number" onclick="appendDecimal()">.</button>
                <button class="btn equals" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script>
        let currentValue = '0';
        let previousValue = '';
        let operator = '';
        let shouldResetDisplay = false;

        const display = document.getElementById('display');

        function updateDisplay(value) {
            display.textContent = value;
            display.classList.add('update');
            setTimeout(() => {
                display.classList.remove('update');
            }, 200);
        }

        function createRipple(event) {
            const button = event.currentTarget;
            const ripple = document.createElement('span');
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            
            button.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 400);
        }

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', createRipple);
        });

        function appendNumber(num) {
            if (shouldResetDisplay) {
                currentValue = '0';
                shouldResetDisplay = false;
            }
            
            if (currentValue === '0') {
                currentValue = num;
            } else {
                currentValue += num;
            }
            
            updateDisplay(currentValue);
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentValue = '0';
                shouldResetDisplay = false;
            }
            
            if (!currentValue.includes('.')) {
                currentValue += '.';
                updateDisplay(currentValue);
            }
        }

        function appendOperator(op) {
            if (previousValue && operator && !shouldResetDisplay) {
                calculate();
            } else {
                previousValue = currentValue;
            }
            
            operator = op;
            shouldResetDisplay = true;
        }

        function calculate() {
            if (!previousValue || !operator) return;
            
            let result;
            const prev = parseFloat(previousValue);
            const curr = parseFloat(currentValue);
            
            try {
                switch (operator) {
                    case '+':
                        result = prev + curr;
                        break;
                    case '-':
                        result = prev - curr;
                        break;
                    case '×':
                        result = prev * curr;
                        break;
                    case '÷':
                        if (curr === 0) {
                            throw new Error('Division by zero');
                        }
                        result = prev / curr;
                        break;
                    case '%':
                        result = prev % curr;
                        break;
                    default:
                        return;
                }
                
                result = parseFloat(result.toFixed(10));
                currentValue = result.toString();
                updateDisplay(currentValue);
                previousValue = '';
                operator = '';
                shouldResetDisplay = true;
            } catch (error) {
                display.classList.add('error');
                currentValue = '0';
                updateDisplay('Error');
                setTimeout(() => {
                    display.classList.remove('error');
                    clearAll();
                }, 1500);
            }
        }

        function clearAll() {
            currentValue = '0';
            previousValue = '';
            operator = '';
            shouldResetDisplay = false;
            updateDisplay('0');
        }

        function backspace() {
            if (currentValue.length > 1) {
                currentValue = currentValue.slice(0, -1);
            } else {
                currentValue = '0';
            }
            updateDisplay(currentValue);
        }

        function toggleSign() {
            if (currentValue !== '0') {
                currentValue = currentValue.startsWith('-') 
                    ? currentValue.slice(1) 
                    : '-' + currentValue;
                updateDisplay(currentValue);
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                appendNumber(e.key);
            } else if (e.key === '.') {
                appendDecimal();
            } else if (e.key === '+') {
                appendOperator('+');
            } else if (e.key === '-') {
                appendOperator('-');
            } else if (e.key === '*') {
                appendOperator('×');
            } else if (e.key === '/') {
                e.preventDefault();
                appendOperator('÷');
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculate();
            } else if (e.key === 'Escape') {
                clearAll();
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                backspace();
            }
        });
    </script>
</body>
</html>
